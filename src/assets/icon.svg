<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <title>CappySculptPaint3D</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2a8c"/>
      <stop offset="1" stop-color="#26144f"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.55" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1f4e"/>
      <stop offset="1" stop-color="#130b26"/>
    </linearGradient>
    <clipPath id="shell"><path d="M84 50 C58 44 26 56 18 84 C14 100 18 114 28 120 L82 120 C88 100 88 70 84 50 Z"/></clipPath>
  </defs>

  <!-- background tile with a faint wireframe mesh -->
  <rect width="160" height="160" rx="30" fill="url(#bg)"/>
  <g stroke="#9b7cff" stroke-opacity=".28" stroke-width="1.2" fill="none">
    <path d="M0 26 L40 10 L84 24 L126 8 L160 22"/>
    <path d="M0 146 L34 154 L70 142 L112 156 L160 144"/>
    <path d="M40 10 L30 0 M84 24 L74 0 M126 8 L138 0 M84 24 L104 0"/>
    <path d="M34 154 L40 160 M70 142 L84 160 M112 156 L120 160"/>
    <path d="M8 62 L0 46 M152 54 L160 72 M154 112 L160 124"/>
  </g>
  <g fill="#ff8a3d" fill-opacity=".75">
    <circle cx="40" cy="10" r="2.2"/><circle cx="84" cy="24" r="2.2"/><circle cx="126" cy="8" r="2.2"/>
    <circle cx="34" cy="154" r="2.2"/><circle cx="70" cy="142" r="2.2"/><circle cx="112" cy="156" r="2.2"/>
    <circle cx="8" cy="62" r="2"/><circle cx="152" cy="54" r="2"/><circle cx="154" cy="112" r="2"/>
  </g>

  <g transform="translate(0 8)">
    <!-- low-poly capybara front -->
    <g stroke="#6e4429" stroke-width=".6" stroke-linejoin="round">
      <polygon points="70,50 96,42 88,76" fill="#c48a5f"/>
      <polygon points="96,42 112,38 106,66" fill="#b9825a"/>
      <polygon points="112,38 130,40 106,66" fill="#c99364"/>
      <polygon points="96,42 106,66 88,76" fill="#a8724c"/>
      <polygon points="130,40 142,52 120,68" fill="#c48c60"/>
      <polygon points="106,66 130,40 120,68" fill="#b27b51"/>
      <polygon points="142,52 149,68 128,76" fill="#b57d53"/>
      <polygon points="120,68 142,52 128,76" fill="#bd845a"/>
      <polygon points="149,68 150,82 128,76" fill="#9a6643"/>
      <polygon points="150,82 144,92 128,76" fill="#8c5b3b"/>
      <polygon points="144,92 134,96 128,76" fill="#85563a"/>
      <polygon points="88,76 106,66 120,68" fill="#b07a52"/>
      <polygon points="88,76 120,68 128,76" fill="#a87350"/>
      <polygon points="88,76 128,76 112,100" fill="#a06c47"/>
      <polygon points="128,76 134,96 124,100 112,100" fill="#8a5a3a"/>
      <polygon points="70,50 88,76 70,118" fill="#9c6a45"/>
      <polygon points="88,76 112,100 70,118" fill="#8f5e3d"/>
      <polygon points="112,100 124,100 122,112 108,112 70,118" fill="#7d5034"/>
      <polygon points="108,112 122,112 126,122 106,122" fill="#6e4429"/>
    </g>
    <polygon points="146,66 150,70 150,77 145,74" fill="#4e301e"/>
    <polygon points="100,42 104,30 114,30 116,40" fill="#8a5a3a" stroke="#6e4429" stroke-width=".6"/>
    <polygon points="105,38 107,33 112,33 112,38" fill="#5e3a24"/>
    <path d="M114 54 Q120 59 127 53" stroke="#2e1b10" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M136 90 Q141 93 145 88" stroke="#2e1b10" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- rear half: a sculpted, texture-painted shell -->
    <g clip-path="url(#shell)">
      <rect x="0" y="40" width="92" height="90" fill="url(#clay)"/>
      <g stroke="#7fe3ff" stroke-opacity=".55" stroke-width="1" fill="none">
        <path d="M18 70 L44 54 L66 60 L88 50"/>
        <path d="M16 92 L38 78 L60 86 L88 76"/>
        <path d="M20 114 L42 102 L62 110 L88 100"/>
        <path d="M44 54 L38 78 L42 102 L40 122 M66 60 L60 86 L62 110 L64 122"/>
        <path d="M44 54 L60 86 M38 78 L62 110 M66 60 L88 76 M60 86 L88 100 M18 70 L38 78 M16 92 L42 102"/>
      </g>
      <path d="M22 86 C36 70 50 94 62 78 S80 74 90 70" stroke="url(#paint)" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M44 86 q2 10 0 14" stroke="#ff6a5e" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M68 76 q2 8 0 12" stroke="#c45cff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <g fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round">
        <path d="M28 106 q5 -4 10 0 t10 0"/>
        <path d="M52 64 q4 -3 8 0"/>
      </g>
    </g>
    <path d="M84 50 C58 44 26 56 18 84 C14 100 18 114 28 120 L82 120 C88 100 88 70 84 50 Z" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-linejoin="round"/>

    <!-- brush painting the shell -->
    <g transform="rotate(-38 46 40)">
      <rect x="42" y="6" width="8" height="30" rx="4" fill="#ffd9a8"/>
      <rect x="41" y="34" width="10" height="8" rx="1.5" fill="#c9ccd6"/>
      <path d="M41 42 h10 l-2 12 q-3 5 -6 0 Z" fill="#ff8a3d"/>
    </g>
  </g>
</svg>
